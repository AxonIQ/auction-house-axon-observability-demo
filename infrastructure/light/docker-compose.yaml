version: '3'
services:
  axon-server:
    image: docker.axoniq.io/axoniq/axonserver:2025.2.7
    ports:
      - "9024:8024"
      - "9124:8124"
    hostname: axonserver-1
    environment:
      - axoniq_console_authentication=0bd3d63f-0-asc:9d491ff34a9b4486b185133e766f9111
      - axoniq.axonserver.standalone-dcb=true
      - axoniq_axonserver_devmode_enabled=true
      - axoniq_console_host=34.110.221.42
      - axoniq_console_port=7000
    env_file:
      - axonserver-variables.env
    volumes:
      - as-data:/axonserver/data
      - as-events:/axonserver/events
      - as-events-second-tier:/axonserver/events-secondtier
      - as-plugins:/axonserver/plugins
      - as-log:/axonserver/log
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8024/actuator/health" ]
      interval: 5s
      timeout: 10s
      retries: 30

  db-participants:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5434:5432'
  db-object-registry:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5435:5432'

  db-auction-query:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5436:5432'

  db-auctions:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5437:5432'

  db-interfaces:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5438:5432'

volumes:
  grafana-storage:
  prometheus-storage:
  as-data:
  as-events:
  as-events-second-tier:
  as-plugins:
  as-log:

